# Location block(s) for serving the public bootstrap scripts built by ../default.nix
# (this flake's `entrypoints` package).
#
# This is a snippet, not a full server block: import it from the `server { ... }` for mmrh.nl in
# the (private) nginx virtual host configuration, e.g.:
#
#   server {
#       server_name mmrh.nl;
#       include /path/to/mybootstrap/entrypoints/nginx/bootstrap-scripts.conf;
#       ...
#   }
#
# The placeholder in the `root` directive below must be substituted with the store path of the
# `entrypoints` package before this file is included by nginx. Rather than doing that
# substitution yourself, prefer consuming this flake's `entrypoints-nginx-configuration` package,
# which already has it applied.

location ~ ^/(bootstrap\.ps1|bootstrap\.sh)$ {
    root @bootstrapScriptsRoot@;
    default_type text/plain;
}
